<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Soft warm background circle -->
  <circle cx="50" cy="50" r="46" fill="#FFFDF7" stroke="#24483D" stroke-width="2.5" stroke-opacity="0.15"/>
  
  <!-- Friendly petals in the core BLOOMI palette -->
  <!-- Top: Lavender -->
  <circle cx="50" cy="24" r="13" fill="#E8DEFF" stroke="#5B32A8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Right Top: Peach -->
  <circle cx="74" cy="40" r="13" fill="#FFE0CC" stroke="#A34812" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Right Bottom: Mint -->
  <circle cx="68" cy="68" r="13" fill="#CDEFE0" stroke="#1E6B4F" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Left Bottom: Soft Yellow -->
  <circle cx="32" cy="68" r="13" fill="#FFF0B3" stroke="#8A6400" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Left Top: Mint Light -->
  <circle cx="26" cy="40" r="13" fill="#CDEFE0" stroke="#1E6B4F" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Center Sprout Flower Core -->
  <circle cx="50" cy="50" r="19" fill="#FFF0B3" stroke="#24483D" stroke-width="2"/>
  
  <!-- Little Sprout Leaf at Top -->
  <path d="M 50 31 C 47 25 43 23 39 24 C 38 29 42 33 50 31 Z" fill="#CDEFE0" stroke="#24483D" stroke-width="1.5"/>
  <path d="M 50 31 C 53 25 57 23 61 24 C 62 29 58 33 50 31 Z" fill="#CDEFE0" stroke="#24483D" stroke-width="1.5"/>
  
  <!-- Happy Eyes in Deep Forest -->
  <circle cx="44" cy="48" r="2.5" fill="#24483D"/>
  <circle cx="56" cy="48" r="2.5" fill="#24483D"/>
  <!-- Eye highlights -->
  <circle cx="45" cy="47" r="0.8" fill="#FFFFFF"/>
  <circle cx="57" cy="47" r="0.8" fill="#FFFFFF"/>
  
  <!-- Warm Smiling Mouth -->
  <path d="M 43 54 Q 50 60 57 54" stroke="#24483D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Cheeks in Soft Peach -->
  <circle cx="39" cy="53" r="2.5" fill="#FFE0CC" stroke="#A34812" stroke-width="0.5"/>
  <circle cx="61" cy="53" r="2.5" fill="#FFE0CC" stroke="#A34812" stroke-width="0.5"/>
</svg>
